"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_line_1)\
$directory\
[](bg:color_line_2 fg:color_line_1)\
$git_branch\
$git_status\
[](fg:color_line_2 bg:color_line_3)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_line_3 bg:color_line_4)\
$docker_context\
$conda\
[](fg:color_line_4 bg:color_line_5)\
$time\
[ ](fg:color_line_5)\
$line_break$character"""

palette = 'tokyo_night_moon'

[palettes.tokyo_night_moon]
color_fg0 = '#c8d3f5'
color_fg1 = '#222436'
color_line_1 = '#2d3f76'
color_line_2 = '#3e4c82'
color_line_3 = '#4e5a8f'
color_line_4 = '#5e689b'
color_line_5 = '#6e76a8'
color_line_6 = '#7e84b5'
color_green = '#c3e88d'
color_red = '#ff757f'
color_purple = '#fca7ea'

[directory]
style = "fg:color_fg0 bg:color_line_1"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_line_2"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_line_2)]($style)'

[git_status]
style = "bg:color_line_2"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_line_2)]($style)'

[nodejs]
symbol = ""
style = "bg:color_line_3"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_line_3)]($style)'

[c]
symbol = " "
style = "bg:color_line_3"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_line_3)]($style)'

[rust]
symbol = ""
style = "bg:color_line_3"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_line_3)]($style)'

[golang]
symbol = ""
style = "bg:color_line_3"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_line_3)]($style)'

[php]
symbol = ""
style = "bg:color_line_3"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_line_3)]($style)'

[java]
symbol = " "
style = "bg:color_line_3"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_line_3)]($style)'

[kotlin]
symbol = ""
style = "bg:color_line_3"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_line_3)]($style)'

[haskell]
symbol = ""
style = "bg:color_line_3"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_line_3)]($style)'

[python]
symbol = ""
style = "bg:color_line_3"
version_format = "v${major}.${minor}"
format = '[[ $symbol( $version)( \($virtualenv\)) ](fg:color_fg0 bg:color_line_3)]($style)'

[docker_context]
symbol = ""
style = "bg:color_line_4"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_line_4)]($style)'

[conda]
style = "bg:color_line_4"
format = '[[ $symbol( $environment) ](fg:#83a598 bg:color_line_4)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_line_5"
format = '[[  $time ](fg:color_fg0 bg:color_line_5)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_green)'
error_symbol = '[❯](bold fg:color_red)'
vimcmd_symbol = '[❮](bold fg:color_green)'
vimcmd_replace_one_symbol = '[❮](bold fg:color_purple)'
vimcmd_replace_symbol = '[❮](bold fg:color_purple)'
vimcmd_visual_symbol = '[❮](bold fg:color_line_2)'
